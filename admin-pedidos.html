<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Pedidos | Administración RHO</title><style>
:root{--navy:#071a35;--green:#4ca500;--orange:#ff5600;--line:#dfe6ec;--muted:#657184;--bg:#f5f8fa}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--navy)}.top{background:var(--navy);color:#fff;padding:14px 4%;display:flex;justify-content:space-between;align-items:center;gap:10px}.top a,.top button{color:#fff;text-decoration:none;background:none;border:0;font-weight:800;cursor:pointer}.actions{display:flex;gap:12px;align-items:center}.wrap{width:min(1180px,94%);margin:24px auto}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}.head h1{margin:0;font-size:clamp(1.8rem,5vw,2.8rem)}.head p{margin:5px 0;color:var(--muted)}.badge{background:#fff3ec;color:#b43a00;border:1px solid #ffd2bd;padding:8px 12px;border-radius:999px;font-weight:800}.panel{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid #edf0f3;text-align:left;vertical-align:top}.table th{font-size:.78rem;color:var(--muted);text-transform:uppercase}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:.75rem;font-weight:800}.paid{background:#edf8e8;color:#356b13}.pending{background:#fff6e7;color:#9a6100}.failed,.cancelled,.expired{background:#fff0ed;color:#a8281d}.items{font-size:.8rem;color:var(--muted);margin-top:4px}.empty{text-align:center;color:var(--muted);padding:20px}@media(max-width:700px){.top{padding:10px 12px}.top strong{font-size:.82rem}.top a,.top button{font-size:.7rem}.actions{gap:7px}.wrap{margin:12px auto}.panel{padding:10px}.table th,.table td{padding:7px 5px;font-size:.72rem}}</style></head><body><header class="top"><strong>RHO · Pedidos</strong><div class="actions"><a href="admin.html">Panel</a><a href="admin-precios.html">Precios</a><button id="logout" type="button">Cerrar sesión</button></div></header><main class="wrap"><div class="head"><div><h1>Pedidos con tarjeta</h1><p>Consulta las órdenes generadas desde el carrito y su estado de pago.</p></div><span class="badge">Solo administrador</span></div><section class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Orden</th><th>Estado</th><th>Cliente</th><th>Artículos</th><th>Total</th><th>Fecha</th></tr></thead><tbody id="body"><tr><td colspan="6" class="empty">Cargando…</td></tr></tbody></table></div></section></main><script type="module">
import {supabase} from './supabase-client.js?v=20260918-card-checkout';
const {data:{session}}=await supabase.auth.getSession();if(!session){location.replace('login.html');throw new Error('Sin sesión');}
const {data:me,error:meError}=await supabase.from('profiles').select('role').eq('id',session.user.id).single();if(meError||me?.role!=='admin'){location.replace('index.html');throw new Error('No autorizado');}
const body=document.getElementById('body'),money=v=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number(v)||0),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={paid:'Pagado',pending:'Pendiente',failed:'Fallido',cancelled:'Cancelado',expired:'Expirado',refunded:'Reembolsado'};
const {data,error}=await supabase.from('orders').select('id,status,customer_email,customer_name,amount_total,currency,created_at,paid_at,order_items(product_name,quantity)').order('created_at',{ascending:false}).limit(100);
if(error){body.innerHTML='<tr><td colspan="6" class="empty">No fue posible cargar los pedidos.</td></tr>';}else{const rows=data||[];body.innerHTML=rows.length?rows.map(o=>`<tr><td><strong>${esc(String(o.id).slice(0,8).toUpperCase())}</strong></td><td><span class="pill ${esc(o.status)}">${esc(labels[o.status]||o.status)}</span></td><td>${esc(o.customer_name||'—')}<div class="items">${esc(o.customer_email||'—')}</div></td><td>${(o.order_items||[]).map(i=>`<div>${i.quantity} × ${esc(i.product_name)}</div>`).join('')}</td><td><strong>${money(o.amount_total)}</strong></td><td>${new Date(o.created_at).toLocaleString('es-MX')}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">Aún no hay pedidos con tarjeta.</td></tr>';}
document.getElementById('logout').onclick=async()=>{await supabase.auth.signOut();location.replace('login.html')};
</script></body></html>
