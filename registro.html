<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <title>Crear cuenta | RHO Seguridad Industrial</title>
  <style>
    :root{--navy:#071a35;--green:#4ca500;--muted:#647083;--line:#e4e9ee;--bg:#f5f8fa}
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;color:var(--navy);background:var(--bg)}
    .top{background:#fff;border-bottom:1px solid var(--line);padding:16px 5%;display:flex;justify-content:space-between;align-items:center}
    .top img{height:48px}.top a{color:var(--navy);font-weight:800;text-decoration:none}
    .wrap{width:min(760px,92%);margin:34px auto}
    .card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 18px 45px rgba(7,26,53,.08)}
    h1{margin:0 0 8px;font-size:clamp(2rem,7vw,3rem)}
    p{color:var(--muted);line-height:1.55}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .field{display:block;font-weight:700}.field.full{grid-column:1/-1}
    .field input,.field select{width:100%;margin-top:7px;padding:14px;border:1px solid #cbd3db;border-radius:12px;font:inherit}
    .check{display:flex;gap:10px;align-items:flex-start;margin:20px 0;color:var(--muted);font-size:.92rem}
    .btn{width:100%;padding:15px;border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:800;font-size:1rem}
    .btn:disabled{opacity:.6}.note{margin-top:16px;font-size:.82rem;text-align:center}
    .note.error{color:#b42318}.note.ok{color:#3f8d00}
    @media(max-width:650px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.card{padding:24px}}
  </style>
</head>
<body>
  <header class="top"><a href="index.html"><img src="logo-rho.jpeg" alt="RHO Seguridad Industrial"></a><a href="login.html">Iniciar sesión</a></header>
  <main class="wrap">
    <section class="card">
      <h1>Crear cuenta</h1>
      <p>Regístrate para agilizar cotizaciones, compras y seguimiento con RHO Seguridad Industrial.</p>
      <form id="registerForm">
        <div class="grid">
          <label class="field">Nombre<input name="nombre" required autocomplete="given-name"></label>
          <label class="field">Apellidos<input name="apellidos" required autocomplete="family-name"></label>
          <label class="field full">Empresa<input name="empresa" autocomplete="organization"></label>
          <label class="field">Correo electrónico<input name="email" type="email" required autocomplete="email"></label>
          <label class="field">Teléfono<input name="telefono" type="tel" autocomplete="tel"></label>
          <label class="field">Contraseña<input name="password" type="password" minlength="8" required autocomplete="new-password"></label>
          <label class="field">Tipo de cliente<select name="tipo"><option>Empresa</option><option>Contratista</option><option>Particular</option><option>Distribuidor</option></select></label>
        </div>
        <label class="check"><input type="checkbox" required><span>Acepto el uso de mis datos para administrar mi cuenta y recibir atención comercial de RHO.</span></label>
        <button class="btn" type="submit">Crear mi cuenta</button>
      </form>
      <p class="note" id="status">Al crear la cuenta, tu sesión se iniciará automáticamente.</p>
    </section>
  </main>
  <script type="module">
    import { supabase } from './supabase-client.js?v=20260913-registration';

    const form = document.getElementById('registerForm');
    const status = document.getElementById('status');
    const button = form.querySelector('button');
    const publishableKey = 'sb_publishable_5Dan5EdjEHyfPDG30opQ8Q_d-Kkp72_';

    const randomNonce = () => {
      const bytes = new Uint8Array(32);
      crypto.getRandomValues(bytes);
      return [...bytes].map((value) => value.toString(16).padStart(2, '0')).join('');
    };

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      status.className = 'note';
      status.textContent = 'Creando cuenta e iniciando sesión…';

      const values = new FormData(form);
      const email = String(values.get('email')).trim().toLowerCase();
      const password = String(values.get('password'));
      const fullName = `${String(values.get('nombre')).trim()} ${String(values.get('apellidos')).trim()}`.trim();
      const nonce = randomNonce();
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: fullName,
            company_name: String(values.get('empresa')).trim(),
            phone: String(values.get('telefono')).trim(),
            customer_type: values.get('tipo'),
            registration_nonce: nonce,
          },
        },
      });

      if (error || !data.user || data.user.identities?.length === 0) {
        status.className = 'note error';
        status.textContent = error?.message?.includes('registered') || data.user?.identities?.length === 0
          ? 'Ese correo ya está registrado. Inicia sesión con tu contraseña.'
          : 'No fue posible crear la cuenta. Revisa los datos e inténtalo de nuevo.';
        button.disabled = false;
        return;
      }

      if (!data.session) {
        const confirmation = await fetch('https://mtpqpxcmngrsivntbgcc.supabase.co/functions/v1/complete-registration', {
          method: 'POST',
          headers: { apikey: publishableKey, 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: data.user.id, email, nonce }),
        });
        const confirmationResult = await confirmation.json();
        if (!confirmation.ok) {
          status.className = 'note error';
          status.textContent = confirmationResult.error || 'La cuenta se creó, pero no fue posible iniciar la sesión automáticamente.';
          button.disabled = false;
          return;
        }

        const { error: signInError } = await supabase.auth.signInWithPassword({ email, password });
        if (signInError) {
          status.className = 'note error';
          status.textContent = 'La cuenta está activa. Inicia sesión con el correo y contraseña registrados.';
          button.disabled = false;
          return;
        }
      }

      status.className = 'note ok';
      status.textContent = 'Cuenta creada. Sesión iniciada correctamente.';
      setTimeout(() => location.replace('index.html'), 700);
    });
  </script>
</body>
</html>
