<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crear cuenta | RHO Seguridad Industrial</title>
<style>
:root{--navy:#071a35;--green:#4ca500;--muted:#647083;--line:#e4e9ee;--bg:#f5f8fa}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--navy);background:var(--bg)}.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 5%;display:flex;justify-content:space-between;align-items:center}.top img{height:48px}.top a{color:var(--navy);font-weight:800;text-decoration:none}.wrap{width:min(760px,92%);margin:34px auto}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 18px 45px rgba(7,26,53,.08)}h1{margin:0 0 8px;font-size:clamp(2rem,7vw,3rem)}p{color:var(--muted);line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:block;font-weight:700}.field.full{grid-column:1/-1}.field input,.field select{width:100%;margin-top:7px;padding:14px;border:1px solid #cbd3db;border-radius:12px;font:inherit}.check{display:flex;gap:10px;align-items:flex-start;margin:20px 0;color:var(--muted);font-size:.92rem}.btn{width:100%;padding:15px;border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:800;font-size:1rem}.note{margin-top:16px;font-size:.82rem;text-align:center}@media(max-width:650px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.card{padding:24px}}
</style></head>
<body><header class="top"><a href="index.html"><img src="logo-rho.jpeg" alt="RHO Seguridad Industrial"></a><a href="login.html">Iniciar sesión</a></header>
<main class="wrap"><section class="card"><h1>Crear cuenta</h1><p>Regístrate para agilizar cotizaciones, compras y seguimiento con RHO Seguridad Industrial.</p>
<form id="registerForm"><div class="grid">
<label class="field">Nombre<input name="nombre" required autocomplete="given-name"></label>
<label class="field">Apellidos<input name="apellidos" required autocomplete="family-name"></label>
<label class="field full">Empresa<input name="empresa" autocomplete="organization"></label>
<label class="field">Correo electrónico<input name="email" type="email" required autocomplete="email"></label>
<label class="field">Teléfono<input name="telefono" type="tel" autocomplete="tel"></label>
<label class="field">Contraseña<input name="password" type="password" minlength="8" required autocomplete="new-password"></label>
<label class="field">Tipo de cliente<select name="tipo"><option>Empresa</option><option>Contratista</option><option>Particular</option><option>Distribuidor</option></select></label>
</div><label class="check"><input type="checkbox" required><span>Acepto el uso de mis datos para administrar mi cuenta y recibir atención comercial de RHO.</span></label><button class="btn" type="submit">Crear mi cuenta</button></form>
<p class="note" id="status">El formulario está preparado. El alta real se activará al conectar la base de datos y autenticación segura.</p></section></main>
<script>document.getElementById('registerForm').addEventListener('submit',function(e){e.preventDefault();document.getElementById('status').textContent='Registro preparado correctamente. Falta activar la conexión segura para guardar la cuenta.';});</script></body></html>
