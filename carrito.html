@media(max-width:800px){.cart-page{padding:8px 9px 30px}.cart-head{margin-bottom:7px}.cart-head h1{font-size:24px;margin-bottom:1px}.cart-head p{font-size:10px;line-height:1.15}.cart-layout{grid-template-columns:1fr;gap:7px}.cart-list{gap:5px}.summary{position:static;padding:9px;border-radius:12px}.cart-card{padding:6px 7px;border-radius:12px}.item-main{grid-template-columns:48px 1fr auto;gap:6px;align-items:start}.item-image{width:48px;height:48px;border-radius:9px}.item-name{font-size:11.5px;line-height:1.03;margin:0 0 2px}.unit-price{font-size:8.5px;line-height:1.05}.unit-price strong{font-size:11px}.item-subtotal{font-size:8px;line-height:1.05}.item-subtotal strong{font-size:11px;margin-top:0}.item-actions{margin-top:4px;padding-top:4px}.qty-btn{width:24px;height:24px;font-size:14px}.qty-value{width:27px;font-size:10px}.remove{font-size:9.5px;padding:1px 0}.summary h2{font-size:14px;margin-bottom:5px}.summary-row{font-size:10px;margin:3px 0}.summary-total{padding-top:5px;margin-top:5px}.summary-total strong{font-size:19px}.summary-note{font-size:8.5px;margin-top:4px}.delivery{margin-top:5px;padding:6px}.delivery strong{font-size:10px}.delivery span{font-size:8.5px}.checkout{margin-top:6px;padding:8px;font-size:10px}.continue{margin-top:7px;font-size:10px}.site-header .nav-wrap{width:100%!important;min-height:64px!important;padding:2px 12px!important;justify-content:space-between!important}.site-header .nav-actions{display:flex!important;width:100%!important;margin:0!important;align-items:center!important;justify-content:space-between!important}.site-header .home-btn,.site-header .account-btn,.site-header .cart-btn,.site-header .menu-btn{position:relative!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:0!important;width:48px!important;min-width:48px!important;height:50px!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;background: <header class="site-header"><div class="container nav-wrap"><div class="nav-actions"><button class="menu-btn" type="button" aria-label="Abrir menú" aria-expanded="false"><svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path></svg><span>Menú</span></button><a class="home-btn" href="index.html"><svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"></path><path d="M5.5 10v10h13V10"></path><path d="M9.5 20v-6h5v6"></path></svg><span>Inicio</span></a><a class="account-btn" href="login.html"><svg class="account-icon" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path><path d="M4.5 20c.8-4 3.3-6 7.5-6s6.7 2 7.5 6"></path></svg><span>Cuenta</span></a><a class="cart-btn" href="carrito.html"><span class="cart-icon-wrap"><svg class="cart-icon" viewBox="0 0 24 24"><path d="M3 4h2l2.1 10.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L20.5 8H6.2"></path><circle cx="9.5" cy="19" r="1.4"></circle><circle cx="17" cy="19" r="1.4"></circle></svg><b class="cart-badge" data-cart-count hidden>0</b></span><span>Carrito</span></a></div><nav class="nav" aria-label="Navegación principal"><a href="index.html">Inicio</a><a href="productos.html">Productos</a><a href="login.html">Iniciar sesión</a><a href="index.html#contacto">Contacto</a></nav></div></header>

<script>document.addEventListener('DOMContentLoaded',function(){const b=document.querySelector('.menu-btn'),n=document.querySelector('.site-header .nav');if(!b||!n)return;b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();const open=n.classList.toggle('open');b.setAttribute('aria-expanded',String(open));});n.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{n.classList.remove('open');b.setAttribute('aria-expanded','false')}));document.addEventListener('click',e=>{if(!n.contains(e.target)&&!b.contains(e.target)){n.classList.remove('open');b.setAttribute('aria-expanded','false')}});});</script>
<script type="module">import{getCart,updateQuantity,removeFromCart,updateCartBadges}from'./cart.js?v=20260901-cart-ultra-compact';const container=document.getElementById('cart-content');const money=v=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(v);const totalMoney=v=>{const [whole,cents='00']=Number(v).toFixed(2).split('.');return `$${Number(whole).toLocaleString('es-MX')}<sup class="total-cents">${cents}</sup>`};const transparent='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';const images={'dpa-30c':'dpa30c-maniqui.svg?v=20260829-harness-fix','pa-31a':'https://dermacare.mx/wp-content/uploads/2023/12/PA-31A-1-600x600.jpg','pa-41':'https://dermacare.mx/wp-content/uploads/2023/12/PA-41-1-600x600.jpg','guante-japones-latex':'assets/guante-japones-latex.webp?v=20260829','guante-carnaza-vestimenta':transparent};function productImage(item){return images[item.id]||item.image||'logo-rho.jpeg'}async function loadCarnazaImage(){const img=document.querySelector('img[data-product-image="guante-carnaza-vestimenta"]');if(!img)return;try{const parts=await Promise.all([0,1,2,3].map(n=>fetch(`assets/guante-carnaza-2888.${n}.b64?v=20260831-cartfix2`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('image part');return r.text()})));img.onerror=function(){this.onerror=null;this.src='logo-rho.jpeg'};img.src='data:image/jpeg;base64,'+parts.join('').replace(/\s+/g,'')}catch(e){img.src='logo-rho.jpeg'}}function render(){const cart=getCart();updateCartBadges();if(!cart.length){container.innerHTML='<p>Tu carrito está vacío.</p>';return}const priced=cart.filter(i=>Number(i.price)>0),unpriced=cart.filter(i=>!(Number(i.price)>0));const total=priced.reduce((s,i)=>s+Number(i.price)*i.qty,0),units=cart.reduce((s,i)=>s+i.qty,0);container.innerHTML=`<div class="cart-layout"><div class="cart-list">${cart.map(item=>{const hp=Number(item.price)>0,sub=hp?Number(item.price)*item.qty:0,img=productImage(item);return`<article class="cart-card"><div class="item-main"><div class="item-image"><img data-product-image="${item.id}" src="${img}" alt="${item.name}" onerror="this.onerror=null;this.src='logo-rho.jpeg'"></div><div><h3 class="item-name">${item.name}</h3>${hp?`<p class="unit-price">Precio unitario: <strong>${money(Number(item.price))}</strong> · IVA incluido</p>`:`<span class="quote-pill">Precio por cotizar</span>`}</div><div class="item-subtotal">${hp?`Subtotal<strong>${money(sub)}</strong>`:'Cotización requerida'}</div></div><div class="item-actions"><div class="qty-control"><button class="qty-btn" data-minus="${item.id}">−</button><input class="qty-value" type="number" min="1" value="${item.qty}" data-qty="${item.id}"><button class="qty-btn" data-plus="${item.id}">+</button></div><button class="remove" data-remove="${item.id}">Quitar</button></div></article>`}).join('')}</div><aside class="summary"><h2>Resumen</h2><div class="summary-row"><span>Artículos</span><strong>${units}</strong></div>${unpriced.length?`<div class="summary-row"><span>Por cotizar</span><strong>${unpriced.length}</strong></div>`:''}<div class="summary-total"><span>Total</span><strong>${totalMoney(total)}</strong></div><p class="summary-note">IVA incluido en productos con precio publicado.</p><div class="delivery"><strong>Entrega estimada</strong><span>2 a 5 días hábiles, sujeto a disponibilidad.</span></div><button id="checkout" class="checkout">Finalizar pedido por WhatsApp</button></aside></div>`;loadCarnazaImage();document.querySelectorAll('[data-qty]').forEach(i=>i.addEventListener('change',()=>{updateQuantity(i.dataset.qty,i.value);render()}));document.querySelectorAll('[data-minus]').forEach(b=>b.addEventListener('click',()=>{const i=getCart().find(x=>x.id===b.dataset.minus);if(i){updateQuantity(i.id,Math.max(1,i.qty-1));render()}}));document.querySelectorAll('[data-plus]').forEach(b=>b.addEventListener('click',()=>{const i=getCart().find(x=>x.id===b.dataset.plus);if(i){updateQuantity(i.id,i.qty+1);render()}}));document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{removeFromCart(b.dataset.remove);render()}));document.getElementById('checkout').addEventListener('click',()=>{const lines=getCart().map(i=>`${i.qty} x ${i.name}${Number(i.price)>0?` — ${money(Number(i.price)*i.qty)}`:' — precio por cotizar'}`).join('\n');const text=`Hola RHO Seguridad Industrial, quiero finalizar este pedido:\n\n${lines}\n\nTotal: ${money(total)}.`;window.open(`https://wa.me/525569090204?text=${encodeURIComponent(text)}`,'_blank','noopener')});}render();</script></body></html>
