<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Carrito | RHO Seguridad Industrial</title><link rel="stylesheet" href="styles.css?v=20260828-noprice"><style>.cart-page{max-width:980px;margin:auto;padding:36px 20px 64px}.cart-page h1{color:#071a35}.cart-empty{padding:30px;border:1px solid #d8dee5;border-radius:20px;text-align:center}.cart-row{display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:center;padding:20px 0;border-bottom:1px solid #e5e9ee}.qty{width:72px;padding:10px;border:1px solid #ccd4dc;border-radius:10px}.remove{border:0;background:none;color:#a33030;font-weight:700}.summary{margin-top:28px;padding:24px;border-radius:20px;background:#f6f8fa}.checkout{display:block;padding:16px;border-radius:14px;background:#4ca500;color:#fff;text-align:center;text-decoration:none;font-weight:800}.continue{display:inline-block;margin-top:18px;color:#071a35;font-weight:700;text-decoration:none}</style></head><body><header class="site-header"><div class="container nav-wrap"><div class="nav-actions" style="display:flex;width:100%;justify-content:space-between;align-items:center"><a href="index.html">Inicio</a><a href="login.html">Cuenta</a><a href="carrito.html">Carrito <span data-cart-count hidden>0</span></a></div></div></header><main class="cart-page"><h1>Tu carrito</h1><p>Agrega los artículos que necesitas y solicita una cotización personalizada.</p><div id="cart-content"></div><a class="continue" href="productos.html">← Seguir agregando productos</a></main><script type="module">import {getCart,updateQuantity,removeFromCart,updateCartBadges} from './cart.js';const container=document.getElementById('cart-content');function render(){const cart=getCart();updateCartBadges();if(!cart.length){container.innerHTML='<div class="cart-empty"><strong>Tu carrito está vacío.</strong><p>Agrega productos para preparar tu solicitud.</p></div>';return}container.innerHTML=`<div>${cart.map(item=>`<div class="cart-row"><div><h3>${item.name}</h3><p>Precio sujeto a cotización</p></div><input class="qty" type="number" min="1" value="${item.qty}" data-qty="${item.id}"><button class="remove" data-remove="${item.id}">Quitar</button></div>`).join('')}</div><div class="summary"><a id="checkout" class="checkout" href="#">Solicitar cotización por WhatsApp</a></div>`;document.querySelectorAll('[data-qty]').forEach(input=>input.addEventListener('change',()=>{updateQuantity(input.dataset.qty,input.value);render()}));document.querySelectorAll('[data-remove]').forEach(btn=>btn.addEventListener('click',()=>{removeFromCart(btn.dataset.remove);render()}));document.getElementById('checkout').addEventListener('click',e=>{e.preventDefault();const lines=getCart().map(item=>`${item.qty} x ${item.name}`).join('\n');const text=`Hola RHO Seguridad Industrial, quiero solicitar cotización de estos artículos:\n${lines}`;window.open(`https://wa.me/525569090204?text=${encodeURIComponent(text)}`,'_blank','noopener')})}render();import('./analytics.js').catch(()=>{});</script></body></html>
