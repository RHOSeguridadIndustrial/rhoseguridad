<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Carrito | RHO Seguridad Industrial</title><link rel="stylesheet" href="styles.css?v=20260901-cart-plus2"><style>
:root{--navy:#071a35;--green:#4ca500;--orange:#ff5600;--muted:#657184;--line:#e2e8ee;--soft:#f6f8fa;--danger:#a33030}body{background:#fff}.cart-page{max-width:1040px;margin:auto;padding:20px 18px 44px}.cart-head{margin-bottom:14px}.cart-head h1{margin:0 0 4px;color:var(--navy);font-size:clamp(28px,5vw,44px);line-height:1.02}.cart-head p{margin:0;color:var(--muted);font-size:14px}.cart-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,.7fr);gap:14px;align-items:start}.cart-list{display:grid;gap:8px}.cart-card{border:1px solid var(--line);border-radius:16px;padding:10px 12px;background:#fff}.item-main{display:grid;grid-template-columns:72px 1fr auto;gap:9px;align-items:center}.item-image{width:72px;height:72px;border:1px solid #edf0f3;border-radius:12px;overflow:hidden;background:#fff;display:grid;place-items:center}.item-image img{width:100%;height:100%;object-fit:contain}.item-name{margin:0 0 3px;color:var(--navy);font-size:16px;line-height:1.08}.unit-price{margin:0;color:var(--muted);font-size:12px}.unit-price strong{color:var(--orange);font-size:15px}.item-subtotal{text-align:right;color:var(--navy);font-weight:800;white-space:nowrap;font-size:11px}.item-subtotal strong{display:block;color:var(--orange);font-size:16px}.item-actions{display:flex;justify-content:space-between;align-items:center;margin-top:7px;padding-top:6px;border-top:1px solid #edf0f3}.qty-control{display:inline-flex;align-items:center;border:1px solid #ccd4dc;border-radius:999px;overflow:hidden}.qty-btn{width:30px;height:30px;border:0;background:#fff;color:var(--navy);font-size:17px}.qty-value{width:32px;border:0;text-align:center;font:800 13px Arial;color:var(--navy)}.remove{border:0;background:none;color:var(--danger);font-weight:800;font-size:12px}.summary{position:sticky;top:88px;padding:12px;border-radius:14px;background:var(--soft);border:1px solid var(--line)}.summary h2{margin:0 0 8px;color:var(--navy);font-size:17px}.summary-row{display:flex;justify-content:space-between;margin:6px 0;color:#445064;font-size:12px}.summary-total{display:flex;justify-content:space-between;align-items:end;padding-top:8px;margin-top:8px;border-top:1px solid #dce3e9}.summary-total span{font-weight:800;color:var(--navy)}.summary-total strong{font-size:23px;color:var(--orange)}.total-cents{font-size:.52em;vertical-align:super}.summary-note{color:var(--muted);font-size:10px}.delivery{margin-top:8px;padding:8px;border-radius:11px;background:#fff;border:1px solid #dfe6ec}.delivery strong{display:block;color:var(--navy);font-size:12px}.delivery span{color:var(--muted);font-size:10px}.checkout{width:100%;margin-top:9px;padding:10px;border:0;border-radius:999px;background:var(--green);color:#fff;font-weight:800}.continue{display:inline-block;margin-top:10px;color:var(--navy);font-weight:800;text-decoration:none}.site-header .cart-icon-wrap{position:relative;display:inline-flex}.site-header .cart-badge{position:absolute;top:-8px;right:-12px;min-width:20px;height:20px;border:2px solid #fff;border-radius:999px;background:#4ca500;color:#fff;display:grid;place-items:center;font-size:11px}

olor!important;stroke-width:2.1!important}.site-header .cart-btn .cart-icon-wrap{position:relative!important;width:21px!important;height:21px!important}.site-header .cart-btn .cart-badge{position:absolute!important;top:-7px!important;right:-10px!important;min-width:18px!important;height:18px!important;border:2px solid #fff!important;border-radius:999px!important;background:#4ca500!important;color:#fff!important;font-size:9px!important}.site-header .cart-btn.has-items>span:last-child{color:#ff5600!important}.site-header .nav{top:64px!important}}
</style></head><body><header class="site-header"><div class="container nav-wrap"><div class="nav-actions"><button class="menu-btn" type="button"><svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Menú</span></button><a class="home-btn" href="index.html"><svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10M9.5 20v-6h5v6"/></svg><span>Inicio</span></a><a class="account-btn" href="login.html"><svg class="account-icon" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.5 20c.8-4 3.3-6 7.5-6s6.7 2 7.5 6"/></svg><span>Cuenta</span></a><a class="cart-btn" href="carrito.html"><span class="cart-icon-wrap"><svg class="cart-icon" viewBox="0 0 24 24"><path d="M3 4h2l2.1 10.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L20.5 8H6.2"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg><b class="cart-badge" data-cart-count hidden>0</b></span><span>Carrito</span></a></div><nav class="nav"><a href="index.html">Inicio</a><a href="productos.html">Productos</a><a href="login.html">Iniciar sesión</a><a href="index.html#contacto">Contacto</a></nav></div></header><main class="cart-page"><div class="cart-head"><h1>Tu carrito</h1><p>Revisa cantidades, precios y el total antes de continuar.</p></div><div id="cart-content"></div><a class="continue" href="productos.html">← Seguir comprando</a></main><script>document.addEventListener('DOMContentLoaded',()=>{const b=document.querySelector('.menu-btn'),n=document.querySelector('.nav');if(b&&n)b.addEventListener('click',()=>n.classList.toggle('open'))})</script><script type="module">import{getCart,updateQuantity,removeFromCart,updateCartBadges}from'./cart.js?v=20260901-cart-plus2';const c=document.getElementById('cart-content'),money=v=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(v),totalMoney=v=>{const[a,b='00']=Number(v).toFixed(2).split('.');return`$${Number(a).toLocaleString('es-MX')}<sup class="total-cents">${b}</sup>`};function render(){const cart=getCart();updateCartBadges();if(!cart.length){c.innerHTML='<p>Tu carrito está vacío.</p>';return}const total=cart.reduce((s,i)=>s+(Number(i.price)||0)*i.qty,0),units=cart.reduce((s,i)=>s+i.qty,0);c.innerHTML=`<div class="cart-layout"><div class="cart-list">${cart.map(i=>`<article class="cart-card"><div class="item-main"><div class="item-image"><img src="${i.image||'logo-rho.jpeg'}" alt="${i.name}" onerror="this.src='logo-rho.jpeg'"></div><div><h3 class="item-name">${i.name}</h3><p class="unit-price">Precio unitario: <strong>${money(Number(i.price)||0)}</strong> · IVA incluido</p></div><div class="item-subtotal">Subtotal<strong>${money((Number(i.price)||0)*i.qty)}</strong></div></div><div class="item-actions"><div class="qty-control"><button class="qty-btn" data-minus="${i.id}">−</button><input class="qty-value" value="${i.qty}" data-qty="${i.id}"><button class="qty-btn" data-plus="${i.id}">+</button></div><button class="remove" data-remove="${i.id}">Quitar</button></div></article>`).join('')}</div><aside class="summary"><h2>Resumen</h2><div class="summary-row"><span>Artículos</span><strong>${units}</strong></div><div class="summary-total"><span>Total</span><strong>${totalMoney(total)}</strong></div><p class="summary-note">IVA incluido en productos con precio publicado.</p><div class="delivery"><strong>Entrega estimada</strong><span>2 a 5 días hábiles, sujeto a disponibilidad.</span></div><button id="checkout" class="checkout">Finalizar pedido por WhatsApp</button></aside></div>`;document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{const i=getCart().find(x=>x.id===b.dataset.minus);if(i){updateQuantity(i.id,Math.max(1,i.qty-1));render()}});document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{const i=getCart().find(x=>x.id===b.dataset.plus);if(i){updateQuantity(i.id,i.qty+1);render()}});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{removeFromCart(b.dataset.remove);render()});document.querySelectorAll('[data-qty]').forEach(x=>x.onchange=()=>{updateQuantity(x.dataset.qty,x.value);render()});document.getElementById('checkout').onclick=()=>{const lines=getCart().map(i=>`${i.qty} x ${i.name} — ${money((Number(i.price)||0)*i.qty)}`).join('\n');window.open(`https://wa.me/525569090204?text=${encodeURIComponent('Hola, quiero realizar este pedido:\n\n'+lines+'\n\nTotal: '+money(total))}`,'_blank')}}render();</script></body></html>
