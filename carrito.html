<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Carrito | RHO Seguridad Industrial</title>
<link rel="stylesheet" href="styles.css?v=20260829-cart-harness-fix">
<style>
:root{--navy:#071a35;--green:#4ca500;--orange:#ff5600;--muted:#657184;--line:#e2e8ee;--soft:#f6f8fa;--danger:#a33030}
body{background:#fff}.cart-page{max-width:1040px;margin:auto;padding:34px 20px 80px}.cart-head{margin-bottom:28px}.cart-head h1{margin:0 0 8px;color:var(--navy);font-size:clamp(36px,7vw,54px);line-height:1.05}.cart-head p{margin:0;color:var(--muted);font-size:16px;line-height:1.5}.cart-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.7fr);gap:24px;align-items:start}.cart-list{display:grid;gap:14px}.cart-card{border:1px solid var(--line);border-radius:22px;padding:18px;background:#fff;box-shadow:0 8px 24px rgba(7,26,53,.05)}.item-main{display:grid;grid-template-columns:92px 1fr auto;gap:16px;align-items:center}.item-image{width:92px;height:92px;border:1px solid #edf0f3;border-radius:16px;overflow:hidden;background:#fff;display:grid;place-items:center}.item-image img{width:100%;height:100%;object-fit:contain}.item-name{margin:0 0 8px;color:var(--navy);font-size:20px;line-height:1.22}.unit-price{margin:0;color:var(--muted);font-size:14px}.unit-price strong{color:var(--orange);font-size:18px}.item-subtotal{text-align:right;color:var(--navy);font-weight:800;white-space:nowrap}.item-subtotal strong{display:block;color:var(--orange);font-size:21px;margin-top:3px}.item-actions{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-top:16px;padding-top:15px;border-top:1px solid #edf0f3}.qty-control{display:inline-flex;align-items:center;border:1px solid #ccd4dc;border-radius:999px;overflow:hidden;background:#fff}.qty-btn{width:42px;height:42px;border:0;background:#fff;color:var(--navy);font-size:22px;cursor:pointer}.qty-value{width:44px;border:0;text-align:center;font:800 16px Arial,sans-serif;color:var(--navy);outline:none}.remove{border:0;background:none;color:var(--danger);font-weight:800;padding:10px 0;cursor:pointer}.summary{position:sticky;top:96px;padding:22px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}.summary h2{margin:0 0 18px;color:var(--navy);font-size:22px}.summary-row{display:flex;justify-content:space-between;gap:18px;margin:12px 0;color:#445064}.summary-row strong{color:var(--navy)}.summary-total{display:flex;justify-content:space-between;align-items:end;gap:18px;padding-top:16px;margin-top:16px;border-top:1px solid #dce3e9}.summary-total span{font-weight:800;color:var(--navy)}.summary-total strong{font-size:30px;color:var(--orange)}.summary-note{margin:14px 0 0;color:var(--muted);font-size:13px;line-height:1.45}.delivery{margin-top:18px;padding:14px;border-radius:16px;background:#fff;border:1px solid #dfe6ec}.delivery strong{display:block;color:var(--navy);margin-bottom:4px}.delivery span{color:var(--muted);font-size:13px}.checkout{display:block;width:100%;margin-top:20px;padding:16px 18px;border:0;border-radius:999px;background:var(--green);color:#fff;text-align:center;font-weight:800;font-size:16px;cursor:pointer}.continue{display:inline-block;margin-top:24px;color:var(--navy);font-weight:800;text-decoration:none}.quote-pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#fff3ea;color:#9b4214;font-weight:800;font-size:12px}@media(max-width:800px){.cart-page{padding:26px 18px 70px}.cart-layout{grid-template-columns:1fr}.summary{position:static}.cart-card{padding:16px}.item-main{grid-template-columns:76px 1fr}.item-image{width:76px;height:76px}.item-subtotal{grid-column:2;text-align:left}.item-subtotal strong{display:inline;margin-left:8px}.item-name{font-size:18px}.site-header .nav-wrap{width:100%!important;min-height:84px!important;padding:8px clamp(16px,5vw,32px)!important}.site-header .nav-actions{display:flex!important;width:100%!important;justify-content:space-between!important}}
</style>
</head>
<body>
<header class="site-header"><div class="container nav-wrap"><div class="nav-actions"><button class="menu-btn" type="button"><span>Menú</span></button><a class="home-btn" href="index.html"><span>Inicio</span></a><a class="account-btn" href="login.html"><span>Cuenta</span></a><a class="cart-btn" href="carrito.html"><span>Carrito <b data-cart-count hidden>0</b></span></a></div></div></header>
<main class="cart-page"><div class="cart-head"><h1>Tu carrito</h1><p>Revisa cantidades, precios y el total antes de continuar.</p></div><div id="cart-content"></div><a class="continue" href="productos.html">← Seguir comprando</a></main>
<script type="module">
import{getCart,updateQuantity,removeFromCart,updateCartBadges}from'./cart.js?v=20260829-cart-harness-fix';
const container=document.getElementById('cart-content');
const money=v=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(v);
const images={
  'dpa-30c':'dpa30c-maniqui.svg?v=20260829-harness-fix',
  'pa-31a':'https://dermacare.mx/wp-content/uploads/2023/12/PA-31A-1-600x600.jpg',
  'pa-41':'https://dermacare.mx/wp-content/uploads/2023/12/PA-41-1-600x600.jpg',
  'guante-japones-latex':'assets/guante-japones-latex.webp?v=20260829'
};
function productImage(item){return images[item.id]||item.image||'logo-rho.jpeg'}
function render(){
 const cart=getCart();updateCartBadges();
 if(!cart.length){container.innerHTML='<p>Tu carrito está vacío.</p>';return}
 const priced=cart.filter(i=>Number(i.price)>0),unpriced=cart.filter(i=>!(Number(i.price)>0));
 const total=priced.reduce((s,i)=>s+Number(i.price)*i.qty,0),units=cart.reduce((s,i)=>s+i.qty,0);
 container.innerHTML=`<div class="cart-layout"><div class="cart-list">${cart.map(item=>{const hp=Number(item.price)>0,sub=hp?Number(item.price)*item.qty:0,img=productImage(item);return`<article class="cart-card"><div class="item-main"><div class="item-image"><img src="${img}" alt="${item.name}" onerror="this.onerror=null;this.src='logo-rho.jpeg'"></div><div><h3 class="item-name">${item.name}</h3>${hp?`<p class="unit-price">Precio unitario: <strong>${money(Number(item.price))}</strong> · IVA incluido</p>`:`<span class="quote-pill">Precio por cotizar</span>`}</div><div class="item-subtotal">${hp?`Subtotal<strong>${money(sub)}</strong>`:'Cotización requerida'}</div></div><div class="item-actions"><div class="qty-control"><button class="qty-btn" data-minus="${item.id}">−</button><input class="qty-value" type="number" min="1" value="${item.qty}" data-qty="${item.id}"><button class="qty-btn" data-plus="${item.id}">+</button></div><button class="remove" data-remove="${item.id}">Quitar</button></div></article>`}).join('')}</div><aside class="summary"><h2>Resumen</h2><div class="summary-row"><span>Artículos</span><strong>${units}</strong></div>${unpriced.length?`<div class="summary-row"><span>Por cotizar</span><strong>${unpriced.length}</strong></div>`:''}<div class="summary-total"><span>Total disponible</span><strong>${money(total)}</strong></div><p class="summary-note">IVA incluido en productos con precio publicado.</p><div class="delivery"><strong>Entrega estimada</strong><span>2 a 5 días hábiles, sujeto a disponibilidad.</span></div><button id="checkout" class="checkout">Finalizar pedido por WhatsApp</button></aside></div>`;
 document.querySelectorAll('[data-qty]').forEach(i=>i.addEventListener('change',()=>{updateQuantity(i.dataset.qty,i.value);render()}));
 document.querySelectorAll('[data-minus]').forEach(b=>b.addEventListener('click',()=>{const i=getCart().find(x=>x.id===b.dataset.minus);if(i){updateQuantity(i.id,Math.max(1,i.qty-1));render()}}));
 document.querySelectorAll('[data-plus]').forEach(b=>b.addEventListener('click',()=>{const i=getCart().find(x=>x.id===b.dataset.plus);if(i){updateQuantity(i.id,i.qty+1);render()}}));
 document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{removeFromCart(b.dataset.remove);render()}));
 document.getElementById('checkout').addEventListener('click',()=>{const lines=getCart().map(i=>`${i.qty} x ${i.name}${Number(i.price)>0?` — ${money(Number(i.price)*i.qty)}`:' — precio por cotizar'}`).join('\n');const text=`Hola RHO Seguridad Industrial, quiero finalizar este pedido:\n\n${lines}\n\nTotal: ${money(total)}.`;window.open(`https://wa.me/525569090204?text=${encodeURIComponent(text)}`,'_blank','noopener')});
}
render();
</script>
</body></html>
