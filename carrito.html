<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Carrito | RHO Seguridad Industrial</title>
<link rel="stylesheet" href="styles.css?v=20260829-cart-premium">
<style>
:root{--navy:#071a35;--green:#4ca500;--orange:#ff5600;--muted:#657184;--line:#e2e8ee;--soft:#f6f8fa;--danger:#a33030}
body{background:#fff}
.cart-page{max-width:1040px;margin:auto;padding:34px 20px 80px}.cart-head{margin-bottom:28px}.cart-head h1{margin:0 0 8px;color:var(--navy);font-size:clamp(36px,7vw,54px);line-height:1.05}.cart-head p{margin:0;color:var(--muted);font-size:16px;line-height:1.5}
.cart-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.7fr);gap:24px;align-items:start}.cart-list{display:grid;gap:14px}.cart-card{border:1px solid var(--line);border-radius:22px;padding:20px;background:#fff;box-shadow:0 8px 24px rgba(7,26,53,.05)}.item-main{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start}.item-name{margin:0 0 8px;color:var(--navy);font-size:20px;line-height:1.22}.unit-price{margin:0;color:var(--muted);font-size:14px}.unit-price strong{color:var(--orange);font-size:18px}.item-subtotal{text-align:right;color:var(--navy);font-weight:800;white-space:nowrap}.item-subtotal strong{display:block;color:var(--orange);font-size:21px;margin-top:3px}.item-actions{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid #edf0f3}.qty-control{display:inline-flex;align-items:center;border:1px solid #ccd4dc;border-radius:999px;overflow:hidden;background:#fff}.qty-btn{width:42px;height:42px;border:0;background:#fff;color:var(--navy);font-size:22px;cursor:pointer}.qty-value{width:44px;border:0;text-align:center;font:800 16px Inter,Arial,sans-serif;color:var(--navy);outline:none;-moz-appearance:textfield}.qty-value::-webkit-inner-spin-button,.qty-value::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.remove{border:0;background:none;color:var(--danger);font-weight:800;padding:10px 0;cursor:pointer}.remove:hover{text-decoration:underline}
.summary{position:sticky;top:96px;padding:22px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}.summary h2{margin:0 0 18px;color:var(--navy);font-size:22px}.summary-row{display:flex;justify-content:space-between;gap:18px;margin:12px 0;color:#445064}.summary-row strong{color:var(--navy)}.summary-total{display:flex;justify-content:space-between;align-items:end;gap:18px;padding-top:16px;margin-top:16px;border-top:1px solid #dce3e9}.summary-total span{font-weight:800;color:var(--navy)}.summary-total strong{font-size:28px;color:var(--orange)}.summary-note{margin:14px 0 0;color:var(--muted);font-size:13px;line-height:1.45}.checkout{display:block;width:100%;margin-top:20px;padding:16px 18px;border:0;border-radius:999px;background:var(--green);color:#fff;text-align:center;text-decoration:none;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 9px 22px rgba(76,165,0,.18)}.checkout:hover{background:#3e8c00}.continue{display:inline-block;margin-top:24px;color:var(--navy);font-weight:800;text-decoration:none}.cart-empty{padding:42px 26px;border:1px solid var(--line);border-radius:22px;text-align:center;background:var(--soft)}.cart-empty strong{display:block;color:var(--navy);font-size:23px;margin-bottom:8px}.cart-empty p{color:var(--muted);margin:0 0 20px}.cart-empty a{display:inline-block;padding:13px 20px;border-radius:999px;background:var(--green);color:#fff;text-decoration:none;font-weight:800}.quote-pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#fff3ea;color:#9b4214;font-weight:800;font-size:12px}
.site-header .cart-badge{display:inline-grid!important;position:absolute;top:-9px;right:-12px;min-width:20px;height:20px;padding:0 5px;place-items:center;border-radius:999px;background:var(--orange);color:#fff;font-size:11px;font-weight:800}.site-header .cart-btn.has-items{color:var(--orange)!important}.site-header .cart-btn{position:relative}
@media(max-width:800px){.cart-page{padding:26px 18px 70px}.cart-layout{grid-template-columns:1fr}.summary{position:static}.cart-card{padding:18px}.item-main{grid-template-columns:1fr}.item-subtotal{text-align:left}.item-subtotal strong{display:inline;margin-left:8px}.item-actions{margin-top:14px}.site-header .nav-wrap{width:100%!important;min-height:84px!important;padding:8px clamp(16px,5vw,32px)!important}.site-header .brand{display:none!important}.site-header .nav-actions{display:flex!important;width:100%!important;justify-content:space-between!important;align-items:center!important}.site-header .home-btn,.site-header .account-btn,.site-header .cart-btn,.site-header .menu-btn{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;width:58px!important;min-width:58px!important;height:62px!important;padding:0!important;border:0!important;background:transparent!important;color:var(--navy)!important;font:700 13px Arial,sans-serif!important;text-decoration:none!important}.site-header svg{width:28px!important;height:28px!important;fill:none;stroke:currentColor;stroke-width:2.1}.site-header .nav{top:84px!important}}
</style>
</head>
<body>
<header class="site-header"><div class="container nav-wrap"><div class="nav-actions">
<button class="menu-btn" type="button" aria-label="Abrir menú" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path></svg><span>Menú</span></button>
<a class="home-btn" href="index.html"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10M9.5 20v-6h5v6"></path></svg><span>Inicio</span></a>
<a class="account-btn" href="login.html"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.5 20c.8-4 3.3-6 7.5-6s6.7 2 7.5 6"></path></svg><span>Cuenta</span></a>
<a class="cart-btn" href="carrito.html"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.1 10.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L20.5 8H6.2"></path><circle cx="9.5" cy="19" r="1.4"></circle><circle cx="17" cy="19" r="1.4"></circle></svg><span>Carrito <b class="cart-badge" data-cart-count hidden>0</b></span></a>
</div><nav class="nav"><a href="index.html">Inicio</a><a href="productos.html">Productos</a><a href="login.html">Iniciar sesión</a><a href="index.html#contacto">Contacto</a></nav></div></header>
<main class="cart-page">
<div class="cart-head"><h1>Tu carrito</h1><p>Revisa cantidades, precios y el total antes de continuar.</p></div>
<div id="cart-content"></div>
<a class="continue" href="productos.html">← Seguir comprando</a>
</main>
<script type="module">
import {getCart,updateQuantity,removeFromCart,updateCartBadges} from './cart.js?v=20260829-cart-premium';
const container=document.getElementById('cart-content');
const money=value=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(value);
const menuBtn=document.querySelector('.menu-btn'),nav=document.querySelector('.nav');
if(menuBtn&&nav){menuBtn.addEventListener('click',()=>{nav.classList.toggle('open');menuBtn.setAttribute('aria-expanded',nav.classList.contains('open'))})}
function render(){
 const cart=getCart();updateCartBadges();
 if(!cart.length){container.innerHTML='<div class="cart-empty"><strong>Tu carrito está vacío</strong><p>Agrega productos para comenzar tu compra.</p><a href="productos.html">Ver productos</a></div>';return}
 const priced=cart.filter(item=>Number.isFinite(Number(item.price))&&Number(item.price)>0);
 const unpriced=cart.filter(item=>!Number.isFinite(Number(item.price))||Number(item.price)<=0);
 const total=priced.reduce((sum,item)=>sum+(Number(item.price)*item.qty),0);
 const units=cart.reduce((sum,item)=>sum+item.qty,0);
 container.innerHTML=`<div class="cart-layout"><div class="cart-list">${cart.map(item=>{
   const hasPrice=Number.isFinite(Number(item.price))&&Number(item.price)>0;
   const subtotal=hasPrice?Number(item.price)*item.qty:0;
   return `<article class="cart-card"><div class="item-main"><div><h3 class="item-name">${item.name}</h3>${hasPrice?`<p class="unit-price">Precio unitario: <strong>${money(Number(item.price))}</strong> · IVA incluido</p>`:`<span class="quote-pill">Precio por cotizar</span>`}</div><div class="item-subtotal">${hasPrice?`Subtotal<strong>${money(subtotal)}</strong>`:'Cotización requerida'}</div></div><div class="item-actions"><div class="qty-control" aria-label="Cantidad"><button class="qty-btn" data-minus="${item.id}" aria-label="Disminuir cantidad">−</button><input class="qty-value" type="number" min="1" inputmode="numeric" value="${item.qty}" data-qty="${item.id}" aria-label="Cantidad de ${item.name}"><button class="qty-btn" data-plus="${item.id}" aria-label="Aumentar cantidad">+</button></div><button class="remove" data-remove="${item.id}">Quitar</button></div></article>`}).join('')}</div><aside class="summary"><h2>Resumen</h2><div class="summary-row"><span>Artículos</span><strong>${units}</strong></div><div class="summary-row"><span>Productos con precio</span><strong>${priced.length}</strong></div>${unpriced.length?`<div class="summary-row"><span>Por cotizar</span><strong>${unpriced.length}</strong></div>`:''}<div class="summary-total"><span>Total disponible</span><strong>${money(total)}</strong></div><p class="summary-note">IVA incluido en los productos con precio publicado.${unpriced.length?' Los artículos sin precio se cotizarán por separado.':''}</p><button id="checkout" class="checkout">Continuar por WhatsApp</button></aside></div>`;
 document.querySelectorAll('[data-qty]').forEach(input=>input.addEventListener('change',()=>{updateQuantity(input.dataset.qty,input.value);render()}));
 document.querySelectorAll('[data-minus]').forEach(btn=>btn.addEventListener('click',()=>{const item=getCart().find(x=>x.id===btn.dataset.minus);if(item){updateQuantity(item.id,Math.max(1,item.qty-1));render()}}));
 document.querySelectorAll('[data-plus]').forEach(btn=>btn.addEventListener('click',()=>{const item=getCart().find(x=>x.id===btn.dataset.plus);if(item){updateQuantity(item.id,item.qty+1);render()}}));
 document.querySelectorAll('[data-remove]').forEach(btn=>btn.addEventListener('click',()=>{removeFromCart(btn.dataset.remove);render()}));
 document.getElementById('checkout').addEventListener('click',()=>{const current=getCart();const lines=current.map(item=>{const hasPrice=Number.isFinite(Number(item.price))&&Number(item.price)>0;return `${item.qty} x ${item.name}${hasPrice?` — ${money(Number(item.price)*item.qty)}`:' — precio por cotizar'}`}).join('\n');const pricedNow=current.filter(i=>Number.isFinite(Number(i.price))&&Number(i.price)>0);const totalNow=pricedNow.reduce((s,i)=>s+(Number(i.price)*i.qty),0);const text=`Hola RHO Seguridad Industrial, quiero continuar con estos artículos:\n\n${lines}\n\nTotal de productos con precio publicado: ${money(totalNow)}.`;window.open(`https://wa.me/525569090204?text=${encodeURIComponent(text)}`,'_blank','noopener')});
}
render();
import('./analytics.js').catch(()=>{});
</script>
</body>
</html>
