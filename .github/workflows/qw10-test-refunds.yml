name: QW10 signed refund reconciliation
on:
  push:
    branches: [qw10-refund-reconciliation-20261025, qw10-review-session-continuity, qw10-review-fresh-results, main]
    paths: ['supabase/qw10-test-refunds.sql', 'supabase/migrations/*qw10_test_refunds.sql', 'supabase/functions/stripe-test-orders/**', 'supabase/functions/_shared/*payment*.js', 'supabase/functions/_shared/refund-confirmation.js', 'tests/test-refund*', 'tests/test-review*', 'admin-revision-pruebas*', 'test-review-model.js', '.github/workflows/qw10-test-refunds.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rho_deployed_fixture
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_fixture_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d rho_deployed_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install locked dependencies
        run: npm ci --prefix tests --ignore-scripts --no-audit --no-fund
      - name: Verify frontend validation
        run: node --test tests/test-review-model.test.mjs
      - name: Verify migration and export exact tested schema
        run: node tests/deployed-fulfillment-database.mjs --export-fixture
      - name: Verify signed receipts through the deployed schema
        run: node tests/deployed-signed-receipt.mjs
      - name: Verify signed refunds and restricted database projection
        run: node tests/test-refund-database.mjs --export-fixture
      - name: Verify concurrent refund deliveries
        env:
          RHO_LOCAL_PG_URL: postgresql://postgres:disposable_fixture_only@127.0.0.1:5432/rho_deployed_fixture
        run: python3 tests/test-refund-concurrent.py
      - name: Install desktop and mobile browser engines
        run: npx --prefix tests playwright install --with-deps chromium webkit
      - name: Verify review UI on desktop and mobile WebKit
        run: node tests/test-review-browser.cjs
