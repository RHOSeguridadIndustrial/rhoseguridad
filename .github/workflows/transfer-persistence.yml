name: Transfer purchase requests
on:
  workflow_dispatch:
  push:
    branches: [main, qw10-transfer-persistence]
    paths:
      - 'supabase/migrations/*transfer_purchase_requests.sql'
      - '*transfer*.js'
      - '*transfer*.html'
      - 'tests/transfer-persistence*'
      - '.github/workflows/transfer-persistence.yml'
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tests
      - run: node tests/transfer-persistence-database.mjs
      - run: node --test tests/transfer-request.test.mjs
      - run: npx --prefix tests playwright install --with-deps chromium webkit
      - run: node tests/transfer-persistence-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transfer-persistence-screenshots
          path: tests/artifacts/transfer-persistence
