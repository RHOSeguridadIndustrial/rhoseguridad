name: Checkout recovery validation
on:
  push:
    branches: [qw10-checkout-ayuda-20261024, main]
    paths: ['checkout-prueba.*', 'tests/checkout-help-browser.cjs', '.github/workflows/checkout-help.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm ci --prefix tests --ignore-scripts --no-audit --no-fund
      - run: node --test tests/checkout-coupon.test.mjs tests/shipping-coupon.test.mjs
      - run: npx --prefix tests playwright install --with-deps chromium webkit
      - run: node tests/checkout-help-browser.cjs
