<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Nueva contraseña | RHO Seguridad Industrial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#071a35;--green:#4ca500;--muted:#647083;--line:#e4e9ee;--bg:#f7f9fb}*{box-sizing:border-box}html,body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--navy);background:var(--bg)}.topbar{height:68px;padding:8px 6%;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}.topbar img{height:42px}.back{color:var(--navy);font-weight:800;text-decoration:none}.wrap{width:min(560px,92%);margin:26px auto}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px}.icon{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#eef6e8;color:var(--green);font-size:26px;margin-bottom:12px}.card h1{font-size:2rem;margin:0 0 7px}.intro{color:var(--muted);line-height:1.4;margin:0 0 18px}.field{display:block;font-weight:700;margin-bottom:13px}.field input{width:100%;margin-top:6px;padding:12px;border:1px solid #cbd3db;border-radius:10px;font:inherit}.primary{width:100%;padding:12px;border:0;border-radius:10px;background:var(--green);color:#fff;font:800 1rem Inter;cursor:pointer}.primary:disabled{opacity:.6}.note{font-size:.82rem;line-height:1.4;text-align:center;margin:12px 0 0;color:var(--muted)}.note.error{color:#b42318}.note.ok{color:#3f8d00}.login{display:none;text-align:center;margin-top:16px;color:var(--navy);font-weight:800;text-decoration:none}.login.show{display:block}@media(max-width:560px){.wrap{margin:12px auto}.card{padding:20px;border-radius:16px}.card h1{font-size:1.65rem}.topbar{padding:6px 7%}.topbar img{height:40px}}
</style>
</head>
<body>
<header class="topbar"><a href="index.html" aria-label="Inicio"><img src="logo-rho.jpeg" alt="RHO Seguridad Industrial"></a><a class="back" href="login.html">Iniciar sesión</a></header>
<main class="wrap"><section class="card"><div class="icon">🔒</div><h1>Crea una nueva contraseña</h1><p class="intro">Elige una contraseña nueva para tu cuenta RHO.</p><form id="resetForm" hidden><label class="field">Nueva contraseña<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label class="field">Confirmar contraseña<input name="confirm" type="password" minlength="8" autocomplete="new-password" required></label><button class="primary" type="submit">Guardar nueva contraseña</button></form><p class="note" id="status">Validando el enlace de recuperación…</p><a id="loginLink" class="login" href="login.html">Ir a iniciar sesión</a></section></main>
<script type="module">
import {supabase} from './supabase-client.js?v=20260918-password-reset';
const form=document.getElementById('resetForm'),status=document.getElementById('status'),button=form.querySelector('button'),login=document.getElementById('loginLink');
let recoveryReady=false;
function ready(){recoveryReady=true;form.hidden=false;status.className='note';status.textContent='Enlace válido. Define tu nueva contraseña.';}
function invalid(){form.hidden=true;status.className='note error';status.textContent='El enlace de recuperación no es válido o ya venció. Solicita uno nuevo desde “¿Olvidaste tu contraseña?”.';login.href='recuperar-password.html';login.textContent='Solicitar otro enlace';login.classList.add('show');}
supabase.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)ready();});
const params=new URLSearchParams(location.search);
if(params.get('code')){try{const {error}=await supabase.auth.exchangeCodeForSession(params.get('code'));if(!error)ready();}catch{}}
if(!recoveryReady){try{const {data:{session}}=await supabase.auth.getSession();if(session&&(location.hash.includes('type=recovery')||params.get('type')==='recovery'))ready();else setTimeout(()=>{if(!recoveryReady)invalid();},1200);}catch{invalid();}}
form.addEventListener('submit',async e=>{
  e.preventDefault();
  if(!recoveryReady)return;
  const f=new FormData(form),password=String(f.get('password')||''),confirm=String(f.get('confirm')||'');
  if(password.length<8){status.className='note error';status.textContent='La contraseña debe tener al menos 8 caracteres.';return;}
  if(password!==confirm){status.className='note error';status.textContent='Las contraseñas no coinciden.';return;}
  button.disabled=true;status.className='note';status.textContent='Actualizando contraseña…';
  const {error}=await supabase.auth.updateUser({password});
  if(error){status.className='note error';status.textContent='No fue posible actualizar la contraseña. Solicita un nuevo enlace si éste ya venció.';button.disabled=false;return;}
  await supabase.auth.signOut({scope:'local'}).catch(()=>{});
  form.hidden=true;status.className='note ok';status.textContent='Contraseña actualizada correctamente. Ya puedes iniciar sesión con tu nueva contraseña.';login.href='login.html';login.textContent='Ir a iniciar sesión';login.classList.add('show');
});
</script>
<script src="./footer.js?v=20260921-global-v2"></script></body>
</html>
