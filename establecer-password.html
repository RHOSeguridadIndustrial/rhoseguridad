<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Activar cuenta | RHO Seguridad Industrial</title>
<style>
:root{--navy:#071a35;--green:#4ca500;--muted:#647083;--line:#e4e9ee;--bg:#f7f9fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--navy)}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:8px 6%}.top img{height:44px}.top a{color:var(--navy);text-decoration:none;font-weight:800}.wrap{min-height:calc(100vh - 66px);display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 12px 36px rgba(7,26,53,.07)}h1{margin:0 0 8px;font-size:clamp(1.8rem,6vw,2.5rem)}p{color:var(--muted);line-height:1.45}.field{display:block;font-weight:800;margin:14px 0}.field input{width:100%;margin-top:6px;padding:12px;border:1px solid #cbd3db;border-radius:10px;font:inherit}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--green);color:#fff;font-weight:800;font-size:1rem;cursor:pointer}.btn:disabled{opacity:.6}.status{margin-top:12px;font-size:.85rem;text-align:center}.status.error{color:#b42318}.status.ok{color:#3f8d00}.login{display:none;text-align:center;margin-top:14px;color:var(--navy);font-weight:800}.login.show{display:block}@media(max-width:560px){.wrap{padding:14px}.card{padding:20px;border-radius:16px}.top{padding:7px 5%}.top img{height:38px}}
</style>
</head>
<body>
<header class="top"><a href="index.html"><img src="logo-rho.jpeg" alt="RHO Seguridad Industrial"></a><a href="login.html">Iniciar sesión</a></header>
<main class="wrap"><section class="card"><h1>Activa tu cuenta RHO</h1><p>Define una contraseña para completar tu registro como cliente.</p><form id="passwordForm"><label class="field">Nueva contraseña<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label class="field">Confirmar contraseña<input name="confirm" type="password" minlength="8" autocomplete="new-password" required></label><button class="btn" type="submit">Guardar contraseña</button></form><p id="status" class="status">Validando tu invitación…</p><a id="loginLink" class="login" href="login.html">Ir a iniciar sesión</a></section></main>
<script type="module">
import {supabase} from './supabase-client.js?v=20260918-admin-customer';
const form=document.getElementById('passwordForm'),status=document.getElementById('status'),button=form.querySelector('button'),login=document.getElementById('loginLink');
let ready=false;
async function check(){
  const {data:{session}}=await supabase.auth.getSession();
  if(session){ready=true;status.textContent='Invitación válida. Define tu contraseña.';return;}
  await new Promise(resolve=>setTimeout(resolve,900));
  const {data:{session:later}}=await supabase.auth.getSession();
  if(later){ready=true;status.textContent='Invitación válida. Define tu contraseña.';return;}
  status.className='status error';status.textContent='La invitación no es válida o ya venció. Solicita una nueva invitación a RHO.';button.disabled=true;login.classList.add('show');
}
form.addEventListener('submit',async e=>{
  e.preventDefault();
  if(!ready)return;
  const data=new FormData(form),password=String(data.get('password')||''),confirm=String(data.get('confirm')||'');
  if(password.length<8){status.className='status error';status.textContent='La contraseña debe tener al menos 8 caracteres.';return;}
  if(password!==confirm){status.className='status error';status.textContent='Las contraseñas no coinciden.';return;}
  button.disabled=true;status.className='status';status.textContent='Guardando contraseña…';
  const {error}=await supabase.auth.updateUser({password});
  if(error){status.className='status error';status.textContent='No fue posible guardar la contraseña. Solicita una nueva invitación si el enlace venció.';button.disabled=false;return;}
  status.className='status ok';status.textContent='Cuenta activada correctamente. Ya puedes iniciar sesión en RHO.';form.hidden=true;login.classList.add('show');
});
await check();
</script>
</body></html>
