<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Recuperar contraseña | RHO Seguridad Industrial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#071a35;--green:#4ca500;--muted:#647083;--line:#e4e9ee;--bg:#f7f9fb}*{box-sizing:border-box}html,body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--navy);background:var(--bg)}.topbar{height:68px;padding:8px 6%;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}.topbar img{height:42px}.back{color:var(--navy);font-weight:800;text-decoration:none}.wrap{width:min(560px,92%);margin:26px auto}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px}.icon{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#eef6e8;color:var(--green);font-size:28px;font-weight:800;margin-bottom:12px}.card h1{font-size:2rem;margin:0 0 7px}.intro{color:var(--muted);line-height:1.4;margin:0 0 18px}.field{display:block;font-weight:700;margin-bottom:13px}.field input{width:100%;margin-top:6px;padding:12px;border:1px solid #cbd3db;border-radius:10px;font:inherit}.primary{width:100%;padding:12px;border:0;border-radius:10px;background:var(--green);color:#fff;font:800 1rem Inter;cursor:pointer}.primary:disabled{opacity:.6}.note{font-size:.82rem;line-height:1.4;text-align:center;margin:12px 0 0;color:var(--muted)}.note.error{color:#b42318}.note.ok{color:#3f8d00}.login{display:block;text-align:center;margin-top:16px;color:var(--navy);font-weight:800;text-decoration:none}@media(max-width:560px){.wrap{margin:12px auto}.card{padding:20px;border-radius:16px}.card h1{font-size:1.65rem}.topbar{padding:6px 7%}.topbar img{height:40px}}
</style>
</head>
<body>
<header class="topbar"><a href="index.html" aria-label="Inicio"><img src="logo-rho.jpeg" alt="RHO Seguridad Industrial"></a><a class="back" href="login.html">Iniciar sesión</a></header>
<main class="wrap"><section class="card"><div class="icon">?</div><h1>¿Olvidaste tu contraseña?</h1><p class="intro">Escribe el correo de tu cuenta RHO. Te enviaremos un enlace seguro para definir una nueva contraseña.</p><form id="recoverForm"><label class="field">Correo electrónico<input id="email" name="email" type="email" autocomplete="email" placeholder="correo@empresa.com" required></label><button class="primary" type="submit">Enviar enlace de recuperación</button></form><p class="note" id="status">Por seguridad, no indicaremos si un correo está o no registrado.</p><a class="login" href="login.html">← Volver a iniciar sesión</a></section></main>
<script type="module">
import {supabase} from './supabase-client.js?v=20260918-password-reset';
const form=document.getElementById('recoverForm'),emailInput=document.getElementById('email'),status=document.getElementById('status'),button=form.querySelector('button');
const preset=new URLSearchParams(location.search).get('email');if(preset)emailInput.value=preset;
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const email=emailInput.value.trim().toLowerCase();
  if(!email)return;
  button.disabled=true;status.className='note';status.textContent='Enviando enlace seguro…';
  try{
    await supabase.auth.resetPasswordForEmail(email,{redirectTo:'https://rhosegind.com/'});
    status.className='note ok';
    status.textContent='Si el correo corresponde a una cuenta RHO, recibirás un enlace para restablecer tu contraseña. Revisa también la carpeta de spam.';
    form.reset();
  }catch{
    status.className='note ok';
    status.textContent='Si el correo corresponde a una cuenta RHO, recibirás un enlace para restablecer tu contraseña. Revisa también la carpeta de spam.';
  }
  button.disabled=false;
});
</script>
<script src="./footer.js?v=20260921-global-v2"></script></body>
</html>
